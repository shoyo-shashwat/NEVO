{% extends "base.html" %}
{% block title %}Sign in — NEVO{% endblock %}
{% block content %}
<div class="report-flow">
  <h1 class="report-flow__heading">Sign in</h1>
  <form method="POST" novalidate>
    {{ form.hidden_tag() }}
    <div class="report-flow__location" style="margin-bottom:0.9rem;">
      <label class="report-flow__location-label">Email</label>
      {{ form.email(class_="report-flow__location-input") }}
    </div>
    <div class="report-flow__location" style="margin-bottom:0.9rem;">
      <label class="report-flow__location-label">Password</label>
      {{ form.password(class_="report-flow__location-input") }}
    </div>
    <button type="submit" class="btn btn--primary btn--large">Sign in</button>
  </form>
  <p style="margin-top:1rem; font-size:0.9rem;">
    <a href="{{ url_for('auth.request_password_reset') }}">Forgot password?</a> ·
    <a href="{{ url_for('auth.citizen_signup') }}">Create an account</a>
  </p>
</div>
{% endblock %}
