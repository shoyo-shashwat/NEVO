{% extends "base.html" %}
{% block title %}Reset your password — BRICS People First{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth-page">
  <span class="auth-page__eyebrow">Forgot password</span>
  <h1>Reset your password</h1>
  <p class="auth-page__sub">Enter your account email and we'll send you a reset link.</p>

  <div class="auth-card">
    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="auth-field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>

      <button type="submit" class="btn btn--primary btn--large auth-submit">Send reset link</button>
    </form>
  </div>

  <p class="auth-links">
    <a href="{{ url_for('auth.signin') }}">Back to sign in</a>
  </p>
</div>
{% endblock %}
