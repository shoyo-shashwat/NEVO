{% extends "base.html" %}
{% block title %}Choose a new password — NEVO{% endblock %}
{% block content %}
<div class="report-flow">
  <h1 class="report-flow__heading">Choose a new password</h1>
  <form method="POST" novalidate>
    {{ form.hidden_tag() }}
    <div class="report-flow__location" style="margin-bottom:0.9rem;">
      <label class="report-flow__location-label">New password</label>
      {{ form.password(class_="report-flow__location-input") }}
    </div>
    <div class="report-flow__location" style="margin-bottom:0.9rem;">
      <label class="report-flow__location-label">Confirm new password</label>
      {{ form.confirm_password(class_="report-flow__location-input") }}
    </div>
    <button type="submit" class="btn btn--primary btn--large">Reset password</button>
  </form>
</div>
{% endblock %}
