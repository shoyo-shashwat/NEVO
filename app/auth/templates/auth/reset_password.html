{% extends "base.html" %}
{% block title %}Set a new password — BRICS People First{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth-page">
  <span class="auth-page__eyebrow">Reset password</span>
  <h1>Choose a new password</h1>

  <div class="auth-card">
    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="auth-field">
        <label for="new_password">New password</label>
        <input type="password" id="new_password" name="new_password" required minlength="8" autofocus>
        <p class="auth-field__hint">At least 8 characters, including a letter and a number.</p>
      </div>

      <div class="auth-field">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
      </div>

      <button type="submit" class="btn btn--primary btn--large auth-submit">Update password</button>
    </form>
  </div>
</div>
{% endblock %}
