{% extends "base.html" %}
{% block title %}Demand Intelligence Map — BRICS People First{% endblock %}

{% block head %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
{% endblock %}

{% block content %}
<div class="gov-map-page">
  <h1>Demand intelligence</h1>

  <div class="filter-bar">
    <button class="filter-btn filter-btn--active" data-cat="">All</button>
    {% for cat in categories %}
      <button class="filter-btn" data-cat="{{ cat.id }}">{{ cat.name }}</button>
    {% endfor %}
  </div>

  <div id="map" style="height:520px; width:100%;"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var map = L.map('map').setView([20, 0], 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 18,
  }).addTo(map);

  var markers = L.layerGroup().addTo(map);
  var activeCategory = '';

  function loadData() {
    var url = '/citizen/map/data';
    if (activeCategory) url += '?category=' + activeCategory;
    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (geojson) {
        markers.clearLayers();
        L.geoJSON(geojson, {
          pointToLayer: function (feature, latlng) {
            return L.circleMarker(latlng, {
              radius: 12, fillColor: '#1d6fa4', color: '#fff',
              weight: 1, fillOpacity: 0.85,
            });
          },
          onEachFeature: function (feature, layer) {
            var p = feature.properties;
            layer.bindPopup(
              '<strong>' + p.category + '</strong><br>' +
              p.localities.join(', ') + '<br>' +
              '<a href="/gov/demand/' + p.id + '">Review evidence →</a>'
            );
          },
        }).addTo(markers);
      });
  }

  document.querySelectorAll('.filter-btn[data-cat]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.filter-btn[data-cat]').forEach(function (b) {
        b.classList.remove('filter-btn--active');
      });
      btn.classList.add('filter-btn--active');
      activeCategory = btn.dataset.cat;
      loadData();
    });
  });

  loadData();
}());
</script>
{% endblock %}
