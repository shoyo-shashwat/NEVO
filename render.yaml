services:
  - type: web
    name: brics-people-first
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        sync: false        # set manually in Render dashboard — never commit
      - key: SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: COHERE_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: FLASK_APP
        value: wsgi:app
